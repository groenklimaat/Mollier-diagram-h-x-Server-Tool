<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a1a;
    color: #ffffff;
    min-height: 100vh;
    transition: direction 0.3s;
  }
  body[dir="rtl"] { font-family: 'Tahoma', Arial, sans-serif; }
  
  header {
    background: #1a1a2e;
    padding: 15px;
    text-align: center;
    border-bottom: 2px solid #e94560;
    position: relative;
  }
  header h1 { color: #ffd700; font-size: 1.6em; margin-bottom: 5px; }
  header p { color: #00d2ff; font-size: 0.9em; }
  
  .lang-selector {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #2d2d44;
    color: white;
    border: 1px solid #00d2ff;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 0.9em;
    cursor: pointer;
  }
  body[dir="rtl"] .lang-selector { right: auto; left: 15px; }

  .container {
    display: grid;
    grid-template-columns: 320px 1fr 1fr;
    gap: 12px;
    padding: 12px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 1200px) { .container { grid-template-columns: 1fr; } }

  .panel {
    background: #1e3a5f;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .panel h2 {
    color: #00d2ff;
    font-size: 1.1em;
    margin-bottom: 12px;
    text-align: center;
    border-bottom: 1px solid #2a5a8a;
    padding-bottom: 8px;
  }

  .input-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }
  .input-row label { font-size: 0.9em; flex: 1; }
  .input-row input[type="number"] {
    width: 80px;
    padding: 6px;
    background: #2d2d44;
    color: #ffffff;
    border: 1px solid #3a5a8a;
    border-radius: 4px;
    text-align: center;
  }
  .input-row span { font-size: 0.85em; color: #b0b0b0; min-width: 40px; }

  input[type="range"] { width: 100%; margin: 5px 0 10px 0; accent-color: #e94560; }

  button {
    width: 100%;
    padding: 12px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  button:hover { background: #ff5a75; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th {
    background: #2a5a8a;
    color: #ffd700;
    padding: 8px 5px;
    text-align: left;
    font-size: 0.9em;
  }
  body[dir="rtl"] th { text-align: right; }
  td { padding: 6px 5px; border-bottom: 1px solid #2a3a5a; }
  td:nth-child(2) { text-align: right; font-weight: bold; color: #00ff88; }
  body[dir="rtl"] td:nth-child(2) { text-align: left; }
  
  .warning-row td { background: #3d1f1f; color: #ff6b6b; }
  .critical-row td { background: #3d1f3d; color: #ff6bff; }
  .section-row td {
    background: #2d1b4e;
    color: #ffd700;
    font-weight: bold;
    text-align: center;
    padding: 8px;
  }

  /* Server Lokaal Advies Box */
  .server-box {
    border-radius: 6px;
    padding: 12px;
    margin-top: 12px;
    font-size: 0.85em;
    line-height: 1.5;
    border-left: 4px solid #ffd700;
    background: #1a1a2e;
  }
  body[dir="rtl"] .server-box { border-left: none; border-right: 4px solid #ffd700; }
  
  .server-box.ok { border-color: #00ff88; background: #1a3a2e; }
  .server-box.warn { border-color: #ffd700; background: #3a2e1a; }
  .server-box.bad { border-color: #ff6b6b; background: #3d1f1f; }

  .info-box {
    background: #1a1a2e;
    border-radius: 6px;
    padding: 12px;
    margin-top: 12px;
    font-size: 0.85em;
    line-height: 1.5;
  }
  .info-box.green { border-left: 4px solid #00ff88; }
  .info-box.red { border-left: 4px solid #ff6b6b; }
  body[dir="rtl"] .info-box.green { border-left: none; border-right: 4px solid #00ff88; }
  body[dir="rtl"] .info-box.red { border-left: none; border-right: 4px solid #ff6b6b; }

  #canvas {
    width: 100%;
    height: 450px;
    background: #0a0a1a;
    border: 1px solid #2a5a8a;
    border-radius: 6px;
    display: block;
  }

  .status {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a1a2e;
    padding: 6px 12px;
    font-size: 0.8em;
    color: #b0b0b0;
    border-top: 1px solid #2a5a8a;
  }
</style>

/* =========================================================
   2. PSYCHROMETRIE (Ongewijzigd)
   ========================================================= */
const PSY = {
  p_atm: 101325, c_pa: 1.006, h_we: 2501, c_pv: 1.86, R_lucht: 287.05,
  p_sat(T) { return 610.78 * Math.exp(17.27 * T / (T + 237.3)); },
  x_uit_pv(p_v) { return 0.62198 * p_v / (this.p_atm - p_v); },
  enthalpie(T, x) { return this.c_pa * T + x * (this.h_we + this.c_pv * T); },
  dauwpunt(p_v) {
    if (p_v <= 0) return null;
    return (237.3 * Math.log(p_v / 610.78)) / (17.27 - Math.log(p_v / 610.78));
  },
  dauwpunt_uit_T_phi(T, phi) { return this.dauwpunt((phi / 100) * this.p_sat(T)); },
  natte_bol(T, phi) {
    const p_v = (phi / 100) * this.p_sat(T);
    const x = this.x_uit_pv(p_v);
    const h = this.enthalpie(T, x);
    let Twb = T - 5;
    for (let i = 0; i < 50; i++) {
      const p_sat_wb = this.p_sat(Twb);
      const x_wb = this.x_uit_pv(p_sat_wb);
      const h_wb = this.enthalpie(Twb, x_wb);
      const delta = h - h_wb;
      if (Math.abs(delta) < 0.001) break;
      Twb += delta / 4.0;
      if (Twb < -10) { Twb = -10; break; }
    }
    return Twb;
  },
  dichtheid(T, x) {
    const T_K = T + 273.15;
    const p_v = x * this.p_atm / (0.62198 + x);
    return ((this.p_atm - p_v) / (this.R_lucht * T_K)) * (1 + x);
  },
  alle_grootheden(T, phi, V_dot) {
    const p_v = (phi / 100) * this.p_sat(T);
    const x = this.x_uit_pv(p_v);
    const h = this.enthalpie(T, x);
    return {
      T, phi, p_v, x, h,
      T_dauw: this.dauwpunt(p_v),
      T_wb: this.natte_bol(T, phi),
      rho: this.dichtheid(T, x),
      V_dot,
      m_dot_lucht: this.dichtheid(T, x) * V_dot,
      m_dot_water: this.dichtheid(T, x) * V_dot * x
    };
  },
  condensatie(V_dot, T, phi, T_surf) {
    const T_dauw = this.dauwpunt_uit_T_phi(T, phi);
    if (T_dauw === null || T_surf >= T_dauw) return { m_dot_condens: 0, T_dauw, heeft_condens: false };
    const x_in = this.x_uit_pv((phi / 100) * this.p_sat(T));
    const m_lucht = this.dichtheid(T, x_in) * V_dot;
    const x_opp = this.x_uit_pv(this.p_sat(T_surf));
    let m = m_lucht * (x_in - x_opp);
    return { m_dot_condens: m < 0 ? 0 : m, T_dauw, heeft_condens: true };
  }
};

/* =========================================================
   4. BEREKENINGEN & SERVER ADVIES
   ========================================================= */
function bereken() {
  const t = TRANSLATIONS[currentLang];
  const T = parseFloat(els.temp.value);
  const phi = parseFloat(els.phi.value);
  const T_surf = parseFloat(els.surf.value);
  const V_dot = parseFloat(els.flow.value);

  if (isNaN(T) || isNaN(phi) || isNaN(T_surf) || isNaN(V_dot)) return;

  const res = PSY.alle_grootheden(T, phi, V_dot);
  const cond = PSY.condensatie(V_dot, T, phi, T_surf);
  let Q_kW = cond.heeft_condens ? cond.m_dot_condens * 2501 / 3600 : 0;

  // --- SERVER ADVIES LOGICA ---
  let serverHtml = '';
  let isOptimal = (T >= 18 && T <= 27 && phi >= 45 && phi <= 55);
  
  if (isOptimal) {
    els.serverBox.className = 'server-box ok';
    serverHtml += `<b>${t.serverOptimal}</b><br><br>`;
  } else {
    els.serverBox.className = 'server-box bad';
    if (T < 18) serverHtml += `<b>${t.serverTooCold}</b><br>`;
    if (T > 27) serverHtml += `<b>${t.serverTooHot}</b><br>`;
    if (phi < 45) serverHtml += `<b>${t.serverTooDry}</b><br>`;
    if (phi > 55) serverHtml += `<b>${t.serverTooHumid}</b><br>`;
    serverHtml += `<br>`;
  }
  serverHtml += `<div style="color:#ffd700; font-size:0.9em; margin-top:5px;">${t.serverAdvies}</div>`;
  els.serverAdvice.innerHTML = serverHtml;

  // --- TABEL ---
  const rows = [
    { type: 'data', label: t.rows[0], value: V_dot.toFixed(1), unit: t.units.m3h },
    { type: 'data', label: t.rows[1], value: res.T.toFixed(1), unit: t.units.c },
    { type: 'data', label: t.rows[2], value: res.phi.toFixed(0), unit: t.units.pct },
    { type: 'data', label: t.rows[3], value: res.p_v.toFixed(0), unit: t.units.pa },
    { type: 'data', label: t.rows[4], value: res.x.toFixed(4), unit: t.units.kgkg },
    { type: 'data', label: t.rows[5], value: res.h.toFixed(1), unit: t.units.kjkg },
    { type: 'data', label: t.rows[6], value: res.T_dauw !== null ? res.T_dauw.toFixed(1) : '--', unit: t.units.c, cls: 'critical-row' },
    { type: 'data', label: t.rows[7], value: res.T_wb.toFixed(1), unit: t.units.c },
    { type: 'data', label: t.rows[8], value: res.rho.toFixed(3), unit: t.units.kgm3 },
    { type: 'data', label: t.rows[9], value: res.m_dot_lucht.toFixed(1), unit: t.units.kgh },
    { type: 'data', label: t.rows[10], value: res.m_dot_water.toFixed(3), unit: t.units.kgh },
    { type: 'section', label: t.condSection },
    { type: 'data', label: t.surfTemp, value: T_surf.toFixed(1), unit: t.units.c },
    { type: 'data', label: t.condensation, value: cond.m_dot_condens.toFixed(3), unit: t.units.kgh, cls: 'warning-row' },
    { type: 'data', label: t.condensation, value: (cond.m_dot_condens * 24).toFixed(3), unit: t.day, cls: 'warning-row' },
    { type: 'data', label: t.condensation, value: (cond.m_dot_condens * 720).toFixed(1), unit: t.month, cls: 'warning-row' },
    { type: 'data', label: t.cooling, value: Q_kW.toFixed(2), unit: t.units.kw },
    { type: 'data', label: t.status, value: cond.heeft_condens ? t.yes : t.no, unit: '', cls: cond.heeft_condens ? 'warning-row' : '' }
  ];

  let html = '';
  rows.forEach(r => {
    if (r.type === 'section') html += `<tr class="section-row"><td colspan="3">${r.label}</td></tr>`;
    else html += `<tr class="${r.cls || ''}"><td>${r.label}</td><td>${r.value}</td><td>${r.unit}</td></tr>`;
  });
  els.resultBody.innerHTML = html;

  // Condensatie-box
  let condHtml = `🌡️ ${t.rows[6]}: ${res.T_dauw !== null ? res.T_dauw.toFixed(1) + t.units.c : '--'}<br>`;
  condHtml += `💧 ${t.rows[4]}: ${res.x.toFixed(4)} ${t.units.kgkg}<br>`;
  condHtml += `💨 ${t.rows[0]}: ${V_dot.toFixed(0)} ${t.units.m3h}<br>`;
  condHtml += `💧 ${t.rows[10]}: ${res.m_dot_water.toFixed(3)} ${t.units.kgh}<br><br>`;

  if (cond.heeft_condens) {
    condHtml += `<b>${t.yesCond}</b><br>`;
    condHtml += `❄️ ${t.surfTemp}: ${T_surf.toFixed(1)}${t.units.c}<br>`;
    condHtml += `📉 ${t.deltaT}${(res.T_dauw - T_surf).toFixed(1)}${t.units.c}<br><br>`;
    condHtml += `<b>${t.condAmount}</b><br>`;
    condHtml += `• ${cond.m_dot_condens.toFixed(3)} ${t.units.kgh}<br>`;
    condHtml += `• ${(cond.m_dot_condens * 24).toFixed(3)} ${t.day}<br>`;
    condHtml += `• ${(cond.m_dot_condens * 720).toFixed(1)} ${t.month}<br><br>`;
    condHtml += `❄️ ${t.cooling}: ${Q_kW.toFixed(2)} ${t.units.kw}`;
    els.condBox.className = 'info-box red';
  } else {
    condHtml += `<b>${t.noCond}</b><br>`;
    if (res.T_dauw !== null) condHtml += `📈 ${(T_surf - res.T_dauw).toFixed(1)}${t.units.c}`;
    els.condBox.className = 'info-box green';
  }
  els.condInfo.innerHTML = condHtml;

  // Samenvatting
  els.summary.innerHTML = `
    🌡️ ${t.rows[1]}: <b>${T.toFixed(1)}${t.units.c}</b><br>
    💧 ${t.rows[2]}: <b>${phi.toFixed(0)}${t.units.pct}</b><br>
    💧 ${t.rows[6]}: <b>${res.T_dauw !== null ? res.T_dauw.toFixed(1) + t.units.c : '--'}</b><br>
    📊 ${t.rows[5]}: <b>${res.h.toFixed(1)} ${t.units.kjkg}</b><br>
    ${cond.heeft_condens
      ? `💧 ${t.condAmount} <b style="color:#ff6b6b">${cond.m_dot_condens.toFixed(3)} ${t.units.kgh}</b>`
      : t.noCond}
  `;

  // Statusbalk
  els.status.innerHTML = `${t.analyzed}T=${T.toFixed(1)}${t.units.c}, φ=${phi.toFixed(0)}${t.units.pct} | ${t.rows[6]}=${res.T_dauw !== null ? res.T_dauw.toFixed(1) + t.units.c : '--'} | V=${V_dot.toFixed(0)} ${t.units.m3h} | ${cond.heeft_condens ? '💧 ' + cond.m_dot_condens.toFixed(3) + ' ' + t.units.kgh : t.noCond}`;

  tekenGrafiek(res, T_surf, cond, t);
}

/* =========================================================
   5. GRAFIEK
   ========================================================= */
function tekenGrafiek(res, T_surf, cond, t) {
  const c = els.canvas, ctx = c.getContext('2d');
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W * window.devicePixelRatio;
  c.height = H * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const margin = 50, pw = W - 2 * margin, ph = H - 2 * margin;
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(margin, margin); ctx.lineTo(margin, H - margin);
  ctx.moveTo(margin, H - margin); ctx.lineTo(W - margin, H - margin);
  ctx.stroke();

  ctx.fillStyle = '#00d2ff'; ctx.font = '11px Arial';
  ctx.save(); ctx.translate(margin - 15, H / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillText('h (kJ/kg)', 0, 0); ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillText('x (kg/kg)', W / 2, H - margin + 20);

  const x_max = 0.035, h_max = 120;
  const xs = pw / x_max, hs = ph / h_max * 0.9;

  ctx.strokeStyle = '#e94560'; ctx.lineWidth = 3; ctx.beginPath();
  let started = false;
  for (let T = -10; T <= 50; T += 0.5) {
    const x = PSY.x_uit_pv(PSY.p_sat(T));
    const h = PSY.enthalpie(T, x);
    if (x >= 0 && x <= x_max && h >= 0 && h <= h_max) {
      const px = margin + x * xs, py = H - margin - h * hs;
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
  }
  ctx.stroke();

  ctx.setLineDash([3, 3]); ctx.lineWidth = 1; ctx.strokeStyle = '#3498db';
  [20, 40, 60, 80].forEach(phiVal => {
    ctx.beginPath(); started = false;
    for (let T = -10; T <= 50; T += 0.5) {
      const p_v = (phiVal / 100) * PSY.p_sat(T);
      const x = PSY.x_uit_pv(p_v);
      const h = PSY.enthalpie(T, x);
      if (x >= 0 && x <= x_max && h >= 0 && h <= h_max) {
        const px = margin + x * xs, py = H - margin - h * hs;
        if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  if (res.x >= 0 && res.x <= x_max && res.h >= 0 && res.h <= h_max) {
    const px = margin + res.x * xs, py = H - margin - res.h * hs;
    ctx.fillStyle = '#e94560'; ctx.beginPath(); ctx.arc(px, py, 8, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(px, py, 18, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    
    const label = `${res.T.toFixed(1)}${t.units.c}, φ=${res.phi.toFixed(0)}${t.units.pct}\nh=${res.h.toFixed(1)} ${t.units.kjkg}`;
    const lines = label.split('\n');
    ctx.font = '10px Arial';
    const textW = Math.max(...lines.map(l => ctx.measureText(l).width)) + 12;
    ctx.fillStyle = 'rgba(26,26,46,0.95)'; ctx.strokeStyle = '#e94560';
    ctx.fillRect(px + 20, py - 30, textW, lines.length * 14 + 8);
    ctx.strokeRect(px + 20, py - 30, textW, lines.length * 14 + 8);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    lines.forEach((l, i) => ctx.fillText(l, px + 26, py - 30 + 16 + i * 14));
  }

  if (res.T_dauw !== null) {
    const x_d = PSY.x_uit_pv(PSY.p_sat(res.T_dauw));
    const h_d = PSY.enthalpie(res.T_dauw, x_d);
    if (x_d >= 0 && x_d <= x_max && h_d >= 0 && h_d <= h_max) {
      const px_d = margin + x_d * xs, py_d = H - margin - h_d * hs;
      const px = margin + res.x * xs, py = H - margin - res.h * hs;
      ctx.strokeStyle = '#ff6bff'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px_d, py_d); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ff6bff'; ctx.beginPath(); ctx.arc(px_d, py_d, 6, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#ff6bff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left';
      ctx.fillText(`${res.T_dauw.toFixed(1)}${t.units.c}`, px_d - 30, py_d + 22);
    }
  }

  const lx = margin + 10, ly = margin + 10;
  ctx.fillStyle = 'rgba(26,26,46,0.95)'; ctx.fillRect(lx, ly, 210, 110);
  ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 1; ctx.strokeRect(lx, ly, 210, 110);
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left';
  ctx.fillText(t.legend, lx + 10, ly + 18);

  ctx.strokeStyle = '#e94560'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx + 10, ly + 35); ctx.lineTo(lx + 35, ly + 35); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '10px Arial'; ctx.fillText(t.satLine, lx + 42, ly + 39);

  ctx.strokeStyle = '#3498db'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(lx + 10, ly + 55); ctx.lineTo(lx + 35, ly + 55); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.fillText(t.phiLine, lx + 42, ly + 59);

  ctx.strokeStyle = '#ff6bff'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(lx + 10, ly + 75); ctx.lineTo(lx + 35, ly + 75); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.fillText(t.dewLine, lx + 42, ly + 79);

  if (cond.heeft_condens) {
    ctx.fillStyle = '#ff6b6b'; ctx.fillRect(lx + 10, ly + 90, 25, 12);
    ctx.font = 'bold 10px Arial'; ctx.fillText(t.condActive, lx + 42, ly + 100);
  }
}
